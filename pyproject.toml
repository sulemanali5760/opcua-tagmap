[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opcua-tagmap"
version = "0.2.0"
description = "Browse an OPC UA server and generate a tag inventory, a static Telegraf config or test-case stubs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Suleman Ali" }]
keywords = ["opcua", "opc-ua", "telegraf", "iiot", "plc", "industrial",
            "automation", "tags", "discovery"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]
dependencies = ["asyncua>=1.1.0"]

[project.optional-dependencies]
dev = ["pytest>=7", "pyyaml>=6"]

[project.urls]
Homepage = "https://github.com/sulemanali5760/opcua-tagmap"
Issues = "https://github.com/sulemanali5760/opcua-tagmap/issues"

[project.scripts]
opcua-tagmap = "opcua_tagmap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
